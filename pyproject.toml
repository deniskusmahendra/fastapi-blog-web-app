[project]
name = "fastapi-blog-web-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Denis Kusmahendra", email = "deniskusmahendra@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.162.2",
    "greenlet>=3.5.6",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
fastapi-blog-web-app = "fastapi_blog_web_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "djlint>=1.49.10",
]

[tool.ruff.lint]
select = ["E", "F", "I"]